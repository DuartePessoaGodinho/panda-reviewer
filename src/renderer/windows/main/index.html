<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src https://gitlab.com;" />
  <title>Panda Reviewer</title>
  <link rel="stylesheet" href="../../../../node_modules/diff2html/bundles/css/diff2html.min.css" />
  <style>
    html { width: 100%; height: 100%; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2128;
      --border: #21262d;
      --border2: #30363d;
      --text: #e6edf3;
      --text2: #8b949e;
      --text3: #848d97;
      --accent: #388bfd;
      --accent-bg: #0d2137;
      --accent-border: #1f6feb;
      --green: #3fb950;
      --red: #f85149;
      --orange: #fc6d26;
      --yellow: #d29922;
      --gitlab: #e24329;
    }

    body {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* ── Titlebar ── */
    .titlebar {
      height: 40px;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px 0 16px;
      -webkit-app-region: drag;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-logo {
      width: 20px; height: 20px;
      border-radius: 5px;
      display: block;
      flex-shrink: 0;
    }
    .app-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text2);
      letter-spacing: -0.01em;
    }
    .titlebar-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      -webkit-app-region: no-drag;
    }
    .last-updated {
      font-size: 10px;
      color: var(--text3);
      margin-right: 8px;
      white-space: nowrap;
    }
    .titlebar-btn {
      width: 28px; height: 28px;
      border: none;
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s, color 0.12s;
    }
    .titlebar-btn:hover { background: var(--border); color: var(--text); }
    .titlebar-btn svg { width: 14px; height: 14px; pointer-events: none; }
    #refreshBtn.spinning svg { animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Layout ── */
    .layout { display: flex; flex: 1; overflow: hidden; min-height: 0; }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .tab-nav {
      padding: 10px 8px 8px;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .tab-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      font-size: 13px;
      text-align: left;
      width: 100%;
      transition: background 0.1s, color 0.1s;
      position: relative;
    }
    .tab-btn:hover { background: var(--surface2); color: var(--text); }
    .tab-btn.active { background: var(--surface2); color: var(--text); font-weight: 600; }
    .tab-btn.active::before {
      content: '';
      position: absolute;
      left: 0; top: 6px; bottom: 6px;
      width: 3px;
      background: var(--accent);
      border-radius: 0 2px 2px 0;
    }
    .tab-icon { font-size: 14px; width: 18px; text-align: center; }
    .tab-count {
      margin-left: auto;
      background: var(--gitlab);
      color: white;
      font-size: 10px;
      font-weight: 700;
      border-radius: 10px;
      padding: 1px 6px;
      min-width: 18px;
      text-align: center;
      transition: background 0.2s;
    }
    .tab-count.zero { background: var(--border); color: var(--text3); }

    .sidebar-footer {
      margin-top: auto;
      padding: 8px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .poll-status {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      font-size: 10px;
      color: var(--text3);
    }
    .poll-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text3);
      flex-shrink: 0;
    }
    .poll-dot.ok { background: var(--green); }
    .poll-dot.err { background: var(--red); }
    .poll-dot.loading { background: var(--yellow); animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    .settings-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      font-size: 13px;
      width: 100%;
      transition: background 0.1s, color 0.1s;
    }
    .settings-btn:hover { background: var(--surface2); color: var(--text); }

    /* ── Sidebar collapse ── */
    .sidebar { transition: width 0.18s ease; }
    .sidebar-toggle {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 2px 6px 2px 10px;
      border: none;
      background: transparent;
      color: var(--text3);
      cursor: pointer;
      width: 100%;
      border-radius: 6px;
      transition: color 0.1s, background 0.1s;
    }
    .sidebar-toggle:hover { color: var(--text2); background: var(--surface2); }
    .sidebar-toggle svg { width: 11px; height: 11px; transition: transform 0.18s ease; flex-shrink: 0; }
    .sidebar.collapsed { width: 48px; }
    .sidebar.collapsed .sidebar-toggle { justify-content: center; padding: 2px 0; }
    .sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }
    .sidebar.collapsed .tab-label { display: none; }
    .sidebar.collapsed .tab-btn { justify-content: center; padding: 10px 0; }
    .sidebar.collapsed .tab-count { position: absolute; top: 3px; right: 3px; min-width: 14px; font-size: 8px; padding: 0 3px; }
    .sidebar.collapsed .tab-count.zero { display: none; }
    .sidebar.collapsed .settings-btn { justify-content: center; padding: 8px 0; }
    .sidebar.collapsed .poll-status { justify-content: center; padding: 5px 0; }
    .sidebar.collapsed #pollText { display: none; }

    /* ── Panel ── */
    .panel { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
    .split { display: flex; flex: 1; overflow: hidden; min-height: 0; }

    /* ── MR List ── */
    .mr-list {
      width: 360px;
      flex-shrink: 0;
      overflow-y: auto;
      scrollbar-gutter: stable;
      padding: 10px;
      border-right: 1px solid var(--border);
    }

    /* ── MR Card ── */
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .mr-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--orange);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .mr-list.animate-cards .mr-card {
      animation: fadeSlideIn 0.18s ease both;
    }
    .mr-card:hover { border-color: var(--accent); border-left-color: var(--orange); background: var(--surface2); box-shadow: 0 2px 12px rgba(0,0,0,0.25); }
    .mr-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .mr-card.active { border-color: var(--accent); border-left-color: var(--orange); background: var(--accent-bg); }
    .mr-card.card-pipeline-run  { border-left-color: var(--yellow); }
    .mr-card.card-pipeline-fail { border-left-color: var(--red); }
    .mr-card.card-approved      { border-left-color: var(--green); }
    .mr-card.draft              { border-left-color: var(--text3); }

    .mr-card-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }
    .avatar {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
      object-fit: cover;
    }
    .mr-meta { flex: 1; min-width: 0; }
    .mr-header-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
    }
    .mr-ref {
      font-size: 10px;
      color: var(--text3);
      font-family: monospace;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mr-badges { display: flex; gap: 4px; margin-left: auto; flex-shrink: 0; }
    .badge {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      line-height: 1.4;
      white-space: nowrap;
    }
    .badge svg { width: 10px; height: 10px; flex-shrink: 0; }
    .badge.draft { background: var(--border); color: var(--text3); }
    .badge.pipeline-ok { background: rgba(63,185,80,0.15); color: var(--green); }
    .badge.pipeline-fail { background: rgba(248,81,73,0.15); color: var(--red); }
    .badge.pipeline-run { background: rgba(210,153,34,0.15); color: var(--yellow); }
    .badge.approved { background: rgba(63,185,80,0.15); color: var(--green); font-weight: 600; }
    .btn-sm.approve-btn { background: rgba(63,185,80,0.12); border-color: rgba(63,185,80,0.3); color: var(--green); font-weight: 600; }
    .btn-sm.approve-btn:hover:not(:disabled) { background: rgba(63,185,80,0.22); border-color: var(--green); }
    .badge.comments { background: rgba(56,139,253,0.12); color: var(--accent); }

    .mr-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .mr-author {
      font-size: 11px;
      color: var(--text3);
      margin-top: 3px;
    }
    .mr-author span { color: var(--text2); }

    .mr-card-bottom {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
    }
    .branch-chip {
      font-size: 10px;
      background: var(--bg);
      color: var(--text2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 110px;
    }
    .arrow-icon { color: var(--text3); font-size: 10px; flex-shrink: 0; }
    .updated-time { margin-left: auto; font-size: 10px; color: var(--text3); white-space: nowrap; }

    .card-actions {
      display: flex;
      gap: 5px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .btn-sm {
      flex: 1;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border2);
      background: var(--bg);
      color: var(--text2);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
      white-space: nowrap;
    }
    .btn-sm:hover { background: var(--border); color: var(--text); }
    .btn-sm.primary { background: var(--accent-bg); border-color: var(--accent-border); color: #58a6ff; }
    .btn-sm.primary:hover { background: #1f3a5a; }
    .btn-sm.link { flex: 0; padding: 6px 9px; }
    .btn-sm:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

    /* ── AI Review button on card ── */
    .btn-sm.ai {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-color: #4a3f6b;
      color: #c084fc;
    }
    .btn-sm.ai:hover { background: linear-gradient(135deg, #2d1b69 0%, #1e1b4b 100%); border-color: #7c3aed; color: #e9d5ff; }
    .btn-sm.ai:disabled { opacity: 0.35; }

    /* ── Skeleton ── */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 4px;
    }
    .skeleton-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 8px;
    }
    .sk-line { height: 10px; margin-bottom: 8px; }
    .sk-title { height: 13px; width: 85%; margin-bottom: 6px; }
    .sk-sub { height: 10px; width: 55%; }

    /* ── Empty state ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 8px;
      padding: 24px;
      text-align: center;
    }
    .empty-icon {
      width: 48px; height: 48px;
      background: var(--surface2);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      margin-bottom: 4px;
    }
    .empty-title { font-size: 14px; font-weight: 600; color: var(--text2); }
    .empty-sub { font-size: 12px; color: var(--text3); line-height: 1.5; }

    /* ── Right panel (diff + AI review) ── */
    .diff-panel { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

    /* Panel tab bar — shown when an MR is selected */
    .panel-tabs {
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      padding: 0 12px;
      flex-shrink: 0;
      height: 40px;
      gap: 2px;
    }
    .panel-tab {
      padding: 0 12px;
      height: 100%;
      border: none;
      background: transparent;
      color: var(--text2);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.12s;
    }
    .panel-tab:hover { color: var(--text); }
    .panel-tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
    .panel-tab.ai-tab.active { border-bottom-color: #7c3aed; color: #c084fc; }
    .panel-tab-badge {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 8px;
      font-weight: 700;
    }

    /* Diff sub-panel */
    .diff-header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      min-height: 41px;
    }
    .diff-title {
      font-size: 13px;
      font-weight: 600;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .diff-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .diff-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 600;
    }
    .diff-badge.files { background: var(--border); color: var(--text2); }
    .diff-badge.add { background: rgba(63,185,80,0.12); color: var(--green); }
    .diff-badge.del { background: rgba(248,81,73,0.12); color: var(--red); }

    .diff-content { flex: 1; min-height: 0; overflow: auto; padding: 12px; }

    .diff-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text3);
      font-size: 13px;
      flex-direction: column;
      gap: 10px;
    }
    .diff-placeholder-icon {
      width: 56px; height: 56px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      margin-bottom: 4px;
    }
    .diff-placeholder p { font-size: 12px; color: var(--text3); }

    /* ── Diff description toggle ── */
    .diff-desc-row { flex-shrink: 0; border-bottom: 1px solid var(--border); }
    .diff-desc-toggle {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 16px; width: 100%; border: none; background: none;
      color: var(--text3); font-size: 11px; cursor: pointer; text-align: left;
      transition: color 0.1s;
    }
    .diff-desc-toggle:hover { color: var(--text2); }
    .diff-desc-toggle svg { width: 10px; height: 10px; transition: transform 0.15s; flex-shrink: 0; }
    .diff-desc-toggle.open svg { transform: rotate(90deg); }
    .diff-desc-body {
      padding: 8px 16px 12px; font-size: 12px; color: var(--text2);
      line-height: 1.6; max-height: 140px; overflow-y: auto;
    }
    .diff-desc-body p { font-size: 12px; margin-bottom: 6px; }
    .diff-desc-body p:last-child { margin-bottom: 0; }

    /* ── AI tab state indicators ── */
    .ai-tab-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-left: 4px;
    }
    .ai-tab-dot.running { background: #7c3aed; animation: pulse 0.8s ease-in-out infinite; }

    /* ── AI New Review (standalone view) ── */
    .ai-new-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
    .ai-new-header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .ai-new-title { font-size: 13px; font-weight: 700; color: var(--text2); }
    .ai-new-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .ai-new-label {
      font-size: 11px; font-weight: 600; color: var(--text2);
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px;
    }
    .ai-new-hint { font-size: 11px; color: var(--text3); line-height: 1.5; }
    .ai-new-footer {
      display: flex; justify-content: flex-end; gap: 8px;
      padding: 12px 16px; border-top: 1px solid var(--border); flex-shrink: 0;
    }

    /* ── AI running: section tracker ── */
    .ai-current-section {
      padding: 5px 16px; font-size: 11px; color: var(--text3);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-style: italic; min-height: 26px; display: flex; align-items: center; gap: 6px;
    }

    /* ── AI reading: TOC ── */
    .ai-toc {
      flex-shrink: 0; padding: 7px 14px; border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; gap: 4px; background: var(--surface);
    }
    .ai-toc-item {
      font-size: 11px; color: var(--text3); padding: 2px 9px;
      border-radius: 10px; background: var(--surface2); border: 1px solid var(--border);
      cursor: pointer; transition: color 0.1s, background 0.1s, border-color 0.1s;
      white-space: nowrap; text-decoration: none; display: inline-block;
    }
    .ai-toc-item:hover { color: var(--text); background: var(--border); border-color: var(--border2); }

    /* ── AI reading: collapsible notes ── */
    .ai-notes-toggle {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 9px 16px; border: none; background: transparent;
      cursor: pointer; border-top: 1px solid var(--border);
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text3); transition: color 0.1s;
    }
    .ai-notes-toggle:hover { color: var(--text2); }
    .ai-notes-toggle svg { width: 10px; height: 10px; margin-left: auto; transition: transform 0.15s; flex-shrink: 0; }
    .ai-notes-toggle.open svg { transform: rotate(180deg); }
    .ai-notes-body { padding: 0 16px 12px; flex-shrink: 0; }

    /* ── AI history: preview line ── */
    .ai-hist-preview {
      font-size: 11px; color: var(--text3); margin-top: 3px;
      line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ── AI Review panel ── */
    .ai-panel {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .ai-repo-warning {
      margin: 12px 16px 0;
      padding: 10px 12px;
      background: rgba(210,153,34,0.08);
      border: 1px solid rgba(210,153,34,0.2);
      border-radius: 8px;
      font-size: 11px;
      color: var(--yellow);
      flex-shrink: 0;
    }

    /* History view */
    .ai-hist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .ai-hist-title { font-size: 13px; font-weight: 700; color: var(--text2); }
    .ai-new-btn {
      padding: 4px 12px;
      background: linear-gradient(135deg, #4c1d95, #5b21b6);
      border: 1px solid #7c3aed;
      color: #e9d5ff;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .ai-new-btn:hover { background: linear-gradient(135deg, #5b21b6, #6d28d9); }

    .ai-new-form {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ai-new-form-actions { display: flex; justify-content: flex-end; gap: 8px; }

    .ai-hist-list {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
    .ai-hist-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 6px;
      color: var(--text3);
      font-size: 12px;
      text-align: center;
      padding: 20px;
    }
    .ai-hist-empty strong { color: var(--text2); font-size: 13px; }
    .ai-hist-item {
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }
    .ai-hist-item:hover { background: var(--surface2); }
    .ai-hist-item-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
    }
    .ai-hist-date { font-size: 12px; font-weight: 600; color: var(--text2); }
    .ai-hist-notes-dot { font-size: 11px; }
    .ai-hist-context { font-size: 11px; color: var(--text3); font-style: italic; }
    .ai-hist-context.no-context { color: var(--border2); }

    /* Running view */
    .ai-running-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* Reading view */
    .ai-reading-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .ai-back-btn {
      padding: 3px 10px;
      border: 1px solid var(--border2);
      background: transparent;
      color: var(--text2);
      border-radius: 5px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.1s;
      flex-shrink: 0;
    }
    .ai-back-btn:hover { background: var(--surface2); color: var(--text); }
    .ai-reading-date { font-size: 12px; color: var(--text3); }
    .ai-reading-context {
      font-size: 11px;
      color: var(--text3);
      font-style: italic;
      padding: 6px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    /* Notes */
    .ai-notes-section {
      flex-shrink: 0;
      padding: 0;
      border-top: none;
    }
    .ai-notes-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text3);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ai-notes-saved { font-size: 10px; color: var(--green); font-weight: 400; text-transform: none; letter-spacing: 0; }
    .ai-notes-textarea {
      width: 100%;
      min-height: 70px;
      max-height: 130px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 7px;
      color: var(--text);
      font-size: 12px;
      padding: 8px 11px;
      resize: vertical;
      outline: none;
      font-family: inherit;
      line-height: 1.5;
      transition: border-color 0.15s;
      user-select: text;
    }
    .ai-notes-textarea:focus { border-color: var(--accent); }
    .ai-notes-textarea::placeholder { color: var(--text3); }

    /* Shared */
    .ai-context-textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      padding: 10px 12px;
      resize: vertical;
      min-height: 64px;
      max-height: 120px;
      outline: none;
      font-family: inherit;
      line-height: 1.5;
      transition: border-color 0.15s, box-shadow 0.15s;
      user-select: text;
    }
    .ai-context-textarea:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,0.12); }
    .ai-context-textarea::placeholder { color: var(--text3); }

    .ai-run-btn {
      height: 34px;
      padding: 0 16px;
      background: linear-gradient(135deg, #4c1d95 0%, #5b21b6 100%);
      border: 1px solid #7c3aed;
      color: #e9d5ff;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, box-shadow 0.15s;
      flex-shrink: 0;
    }
    .ai-run-btn:hover { background: linear-gradient(135deg, #5b21b6 0%, #6d28d9 100%); box-shadow: 0 2px 12px rgba(124,58,237,0.3); }
    .ai-run-btn:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }

    /* AI output */
    .ai-output-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      min-height: 0;
    }

    .ai-status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .ai-status-dot.running { background: #7c3aed; animation: pulse 0.8s ease-in-out infinite; }
    .ai-status-dot.done    { background: var(--green); }
    .ai-status-dot.error   { background: var(--red); }

    .ai-running-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px 18px 28px;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(circle at 50% 38%, rgba(245,158,11,0.10), transparent 30%),
        linear-gradient(180deg, rgba(17,24,39,0.10), rgba(3,7,18,0.20));
    }
    .ai-running-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(circle at center, #000, transparent 72%);
    }
    .ai-study-scene {
      position: relative;
      width: min(320px, 82vw);
      aspect-ratio: 1.32;
      perspective: 760px;
      z-index: 1;
    }
    .study-shadow {
      position: absolute;
      left: 13%;
      right: 13%;
      bottom: 5%;
      height: 26px;
      border-radius: 999px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.36), transparent 68%);
      filter: blur(7px);
      animation: studyShadow 3.4s ease-in-out infinite;
    }
    .study-desk {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      animation: sceneFloat 3.4s ease-in-out infinite;
    }
    .desk-top {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 14%;
      height: 22%;
      border-radius: 14px 14px 22px 22px;
      background: linear-gradient(180deg, #9a5b2d, #5b321e);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: inset 0 10px 0 rgba(255,255,255,0.10), 0 18px 36px rgba(0,0,0,0.28);
      transform: rotateX(58deg) translateZ(-18px);
    }
    .panda-figure {
      position: absolute;
      left: 50%;
      top: 8%;
      width: 44%;
      height: 60%;
      transform: translateX(-50%) rotateX(-5deg) rotateY(-8deg);
      transform-style: preserve-3d;
      animation: pandaRead 2.2s ease-in-out infinite;
      z-index: 4;
    }
    .panda-head {
      position: absolute;
      left: 14%;
      top: 0;
      width: 72%;
      height: 58%;
      border-radius: 48% 48% 45% 45%;
      background: linear-gradient(145deg, #fffaf0, #e8edf4);
      box-shadow: inset -14px -12px 22px rgba(15,23,42,0.13), 0 12px 24px rgba(0,0,0,0.20);
      transform: translateZ(34px);
      z-index: 3;
    }
    .panda-ear {
      position: absolute;
      top: 0;
      width: 25%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: linear-gradient(145deg, #171923, #05070d);
      box-shadow: inset -5px -5px 10px rgba(255,255,255,0.08);
      z-index: 2;
    }
    .panda-ear.left { left: 7%; }
    .panda-ear.right { right: 7%; }
    .panda-patch {
      position: absolute;
      top: 35%;
      width: 28%;
      height: 29%;
      border-radius: 48%;
      background: #10131c;
      transform: rotate(-16deg);
    }
    .panda-patch.right { right: 16%; transform: rotate(16deg); }
    .panda-patch.left { left: 16%; }
    .panda-patch b {
      position: absolute;
      left: 44%;
      top: 42%;
      width: 18%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #f8fafc;
      box-shadow: 0 0 0 2px #05070d;
      animation: blinkEye 4.8s ease-in-out infinite;
    }
    .panda-nose {
      position: absolute;
      left: 44%;
      top: 58%;
      width: 12%;
      height: 9%;
      border-radius: 55% 55% 60% 60%;
      background: #11131a;
    }
    .panda-mouth {
      position: absolute;
      left: 48%;
      top: 68%;
      width: 12%;
      height: 9%;
      border-bottom: 2px solid #2b2f3a;
      border-radius: 0 0 999px 999px;
      transform: translateX(-50%);
    }
    .panda-body {
      position: absolute;
      left: 18%;
      top: 45%;
      width: 64%;
      height: 48%;
      border-radius: 42% 42% 28% 28%;
      background: linear-gradient(150deg, #f7f1e8 0 56%, #1b1d27 57% 100%);
      box-shadow: inset -10px -8px 18px rgba(0,0,0,0.16);
      transform: translateZ(8px);
      z-index: 1;
    }
    .panda-arm {
      position: absolute;
      top: 36%;
      width: 28%;
      height: 42%;
      border-radius: 999px;
      background: #11131a;
      z-index: 5;
    }
    .panda-arm.left {
      left: -14%;
      transform: rotate(25deg);
      animation: leftPaw 2.2s ease-in-out infinite;
    }
    .panda-arm.right {
      right: -14%;
      transform: rotate(-25deg);
      animation: rightPaw 2.2s ease-in-out infinite;
    }
    .open-book {
      position: absolute;
      left: 25%;
      right: 25%;
      bottom: 20%;
      height: 26%;
      transform-style: preserve-3d;
      transform: rotateX(64deg) translateZ(28px);
      z-index: 5;
    }
    .book-page {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(135deg, #fff7df, #e7d8b3);
      border: 1px solid rgba(81,52,25,0.24);
      box-shadow: inset 0 5px 12px rgba(255,255,255,0.45), 0 8px 12px rgba(0,0,0,0.18);
    }
    .left-page { left: 0; border-radius: 10px 3px 5px 14px; transform-origin: right center; transform: rotateY(18deg); }
    .right-page { right: 0; border-radius: 3px 10px 14px 5px; transform-origin: left center; transform: rotateY(-18deg); animation: pageTurn 2.7s ease-in-out infinite; }
    .book-page i, .floating-page i {
      display: block;
      height: 2px;
      margin: 9px 12px 0;
      border-radius: 99px;
      background: rgba(92,64,38,0.30);
    }
    .book-spine {
      position: absolute;
      left: 48%;
      top: 0;
      width: 4%;
      height: 103%;
      border-radius: 999px;
      background: rgba(79,45,25,0.34);
      z-index: 2;
    }
    .book-stack {
      position: absolute;
      bottom: 25%;
      width: 22%;
      height: 22%;
      transform: rotateX(60deg) translateZ(20px);
      z-index: 3;
    }
    .book-stack.left { left: 9%; transform: rotateX(60deg) rotateZ(-5deg) translateZ(20px); }
    .book-stack.right { right: 8%; transform: rotateX(60deg) rotateZ(6deg) translateZ(20px); }
    .book-stack span {
      position: absolute;
      left: 0;
      width: 100%;
      height: 25%;
      border-radius: 5px;
      box-shadow: inset 0 4px 0 rgba(255,255,255,0.20);
    }
    .book-stack span:nth-child(1) { bottom: 0; background: #2f7d6d; }
    .book-stack span:nth-child(2) { bottom: 24%; background: #bc6c25; width: 88%; left: 7%; }
    .book-stack span:nth-child(3) { bottom: 48%; background: #6d5bd0; width: 94%; left: 2%; }
    .floating-page {
      position: absolute;
      width: 18%;
      height: 22%;
      border-radius: 8px 5px 10px 5px;
      background: linear-gradient(145deg, rgba(255,248,221,0.95), rgba(226,213,181,0.92));
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 14px 28px rgba(0,0,0,0.20);
      z-index: 2;
    }
    .page-one { left: 6%; top: 16%; animation: pageFloatOne 4.2s ease-in-out infinite; }
    .page-two { right: 7%; top: 20%; animation: pageFloatTwo 4.6s ease-in-out infinite; }
    .ai-running-copy {
      width: min(440px, 100%);
      text-align: center;
      z-index: 1;
    }
    .ai-running-copy h2 {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.25;
      color: var(--text);
    }
    .ai-running-copy p {
      margin: 0 auto 14px;
      max-width: 390px;
      font-size: 12px;
      line-height: 1.55;
      color: var(--text3);
    }
    .ai-review-steps {
      position: relative;
      height: 22px;
      color: #fbbf24;
      font-size: 11px;
      font-weight: 700;
      overflow: hidden;
    }
    .ai-review-steps span {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: translateY(10px);
      animation: reviewStep 8s ease-in-out infinite;
    }
    .ai-review-steps span:nth-child(2) { animation-delay: 2s; }
    .ai-review-steps span:nth-child(3) { animation-delay: 4s; }
    .ai-review-steps span:nth-child(4) { animation-delay: 6s; }
    .ai-progress-rail {
      width: min(280px, 76%);
      height: 4px;
      margin: 10px auto 0;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
    }
    .ai-progress-rail span {
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, #f59e0b, #22c55e, transparent);
      animation: progressSweep 1.6s ease-in-out infinite;
    }

    .ai-cancel-btn {
      padding: 3px 10px;
      border: 1px solid var(--border2);
      background: transparent;
      color: var(--text2);
      border-radius: 5px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .ai-cancel-btn:hover { background: var(--surface2); color: var(--text); }

    /* Markdown-ish output rendering */
    .ai-output-area { user-select: text; }
    .ai-output-area h1, .ai-output-area h2, .ai-output-area h3 {
      color: var(--text);
      margin: 16px 0 8px;
      line-height: 1.3;
    }
    .ai-output-area h1 { font-size: 16px; }
    .ai-output-area h2 { font-size: 14px; }
    .ai-output-area h3 { font-size: 13px; color: var(--text2); }
    .ai-output-area p { font-size: 13px; line-height: 1.6; color: var(--text2); margin-bottom: 10px; }
    .ai-output-area strong { color: var(--text); }
    .ai-output-area code {
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 11px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      color: #58a6ff;
    }
    .ai-output-area pre {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      margin-bottom: 12px;
    }
    .ai-output-area pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 12px;
      color: var(--text);
    }
    .ai-output-area ul, .ai-output-area ol {
      padding-left: 20px;
      margin-bottom: 10px;
    }
    .ai-output-area li { font-size: 13px; line-height: 1.6; color: var(--text2); margin-bottom: 3px; }
    .ai-output-area blockquote {
      border-left: 3px solid var(--border2);
      padding-left: 12px;
      color: var(--text3);
      font-style: italic;
      margin-bottom: 10px;
    }
    .ai-output-area hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
    .ai-cursor {
      display: inline-block;
      width: 2px; height: 14px;
      background: #7c3aed;
      border-radius: 1px;
      animation: blink 0.8s step-end infinite;
      vertical-align: text-bottom;
      margin-left: 2px;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes sceneFloat {
      0%, 100% { transform: translateY(0) rotateX(0deg); }
      50% { transform: translateY(-7px) rotateX(1.5deg); }
    }
    @keyframes studyShadow {
      0%, 100% { opacity: 0.72; transform: scaleX(0.94); }
      50% { opacity: 0.48; transform: scaleX(1.04); }
    }
    @keyframes pandaRead {
      0%, 100% { transform: translateX(-50%) rotateX(-5deg) rotateY(-8deg) rotateZ(-1deg); }
      50% { transform: translateX(-50%) rotateX(-3deg) rotateY(8deg) rotateZ(1deg); }
    }
    @keyframes leftPaw {
      0%, 100% { transform: rotate(25deg) translateY(0); }
      50% { transform: rotate(17deg) translateY(6px); }
    }
    @keyframes rightPaw {
      0%, 100% { transform: rotate(-25deg) translateY(0); }
      50% { transform: rotate(-17deg) translateY(6px); }
    }
    @keyframes pageTurn {
      0%, 60%, 100% { transform: rotateY(-18deg); }
      78% { transform: rotateY(-52deg) translateZ(5px); }
    }
    @keyframes pageFloatOne {
      0%, 100% { transform: translate3d(0, 0, 20px) rotateZ(-12deg) rotateY(-16deg); opacity: 0.72; }
      50% { transform: translate3d(10px, -20px, 42px) rotateZ(7deg) rotateY(18deg); opacity: 1; }
    }
    @keyframes pageFloatTwo {
      0%, 100% { transform: translate3d(0, 0, 18px) rotateZ(11deg) rotateY(18deg); opacity: 0.72; }
      50% { transform: translate3d(-12px, -18px, 38px) rotateZ(-8deg) rotateY(-14deg); opacity: 1; }
    }
    @keyframes blinkEye {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.12); }
    }
    @keyframes reviewStep {
      0%, 18% { opacity: 0; transform: translateY(10px); }
      24%, 43% { opacity: 1; transform: translateY(0); }
      49%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    @keyframes progressSweep {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(260%); }
    }

    }
    .d2h-file-list { background: var(--surface) !important; margin: 0 !important; }
    .d2h-file-list li { border-color: var(--border) !important; }
    .d2h-file-list a { color: #58a6ff !important; text-decoration: none; }
    .d2h-file-stats { font-size: 10px !important; }
    .d2h-file-added-icon { color: var(--green) !important; }
    .d2h-file-deleted-icon { color: var(--red) !important; }
    .d2h-file-renamed-icon { color: var(--yellow) !important; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #484f58; }

    /* ── Toast ── */
    .toast-container {
      position: fixed;
      bottom: 16px; right: 16px;
      display: flex; flex-direction: column; gap: 8px;
      z-index: 200;
      pointer-events: none;
    }
    .toast {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--text);
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      animation: toastIn 0.2s ease both;
      pointer-events: auto;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(8px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .toast.out { animation: toastOut 0.18s ease both; }
    @keyframes toastOut {
      to { opacity: 0; transform: translateY(4px) scale(0.97); }
    }
    .toast-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .toast-dot.ok { background: var(--green); }
    .toast-dot.err { background: var(--red); }
    .toast-dot.info { background: var(--accent); }

    /* ── Clone dialog ── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      backdrop-filter: blur(2px);
    }
    .overlay.hidden { display: none; }
    .dialog {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 24px;
      width: 460px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    .dialog-icon { font-size: 24px; margin-bottom: 12px; }
    .dialog h3 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .dialog p { font-size: 12px; color: var(--text2); margin-bottom: 16px; line-height: 1.5; }
    .clone-cmd {
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 10px 12px;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 12px;
      color: #58a6ff;
      word-break: break-all;
      margin-bottom: 16px;
      user-select: text;
      line-height: 1.5;
    }
    .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .btn-dialog {
      padding: 7px 16px;
      border-radius: 6px;
      border: 1px solid var(--border2);
      background: var(--surface2);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .btn-dialog:hover { background: var(--border); }
    .btn-dialog.accent { background: var(--accent-bg); border-color: var(--accent-border); color: #58a6ff; }
    .btn-dialog.accent:hover { background: #1f3a5a; }
  </style>
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-left">
      <img class="app-logo" src="../../../../assets/icon.svg" alt="" />
      <span class="app-name">Panda Reviewer</span>
    </div>
    <div class="titlebar-actions">
      <span class="last-updated" id="lastUpdated"></span>
      <button class="titlebar-btn" id="refreshBtn" title="Refresh now">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/><path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/></svg>
      </button>
      <button class="titlebar-btn" id="minimizeBtn" title="Minimize">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 8a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11A.5.5 0 0 1 2 8z"/></svg>
      </button>
      <button class="titlebar-btn" id="closeBtn" title="Close">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/></svg>
      </button>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar" id="sidebar">
      <div class="tab-nav">
        <button class="sidebar-toggle" id="sidebarToggle" title="Collapse sidebar">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/></svg>
        </button>
        <button class="tab-btn active" data-tab="review" title="To Review">
          <span class="tab-icon">👀</span><span class="tab-label"> To Review</span>
          <span class="tab-count zero" id="reviewCount">0</span>
        </button>
        <button class="tab-btn" data-tab="mine" title="My MRs">
          <span class="tab-icon">🔀</span><span class="tab-label"> My MRs</span>
          <span class="tab-count zero" id="mineCount">0</span>
        </button>
      </div>
      <div class="sidebar-footer">
        <div class="poll-status" id="pollStatus">
          <div class="poll-dot loading" id="pollDot"></div>
          <span id="pollText">Connecting…</span>
        </div>
        <button class="settings-btn" id="settingsBtn">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/><path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.892 3.433-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.892-1.64-.901-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.474l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115l.094-.319z"/></svg>
          <span class="tab-label">Settings</span>
        </button>
      </div>
    </div>

    <div class="panel">
      <div class="split">
        <div class="mr-list" id="mrList">
          <div class="skeleton-card">
            <div class="skeleton sk-line" style="width:40%"></div>
            <div class="skeleton sk-title"></div>
            <div class="skeleton sk-sub"></div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton sk-line" style="width:35%"></div>
            <div class="skeleton sk-title" style="width:75%"></div>
            <div class="skeleton sk-sub" style="width:45%"></div>
          </div>
        </div>
        <div class="diff-panel" id="diffPanel">
          <div class="diff-placeholder">
            <div class="diff-placeholder-icon">📋</div>
            <strong style="color:var(--text2);font-size:13px;">No MR selected</strong>
            <p>Click an MR card or "AI Review"<br>to get started.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Clone dialog -->
  <div class="overlay hidden" id="cloneOverlay">
    <div class="dialog">
      <div class="dialog-icon">📦</div>
      <h3>Project not cloned locally</h3>
      <p>This project wasn't found in your configured repo folders. Clone it first, then try again.</p>
      <div class="clone-cmd" id="cloneCmd"></div>
      <div class="dialog-actions">
        <button class="btn-dialog" id="cloneClose">Dismiss</button>
        <button class="btn-dialog accent" id="cloneCopy">Copy command</button>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="../../../../node_modules/diff2html/bundles/js/diff2html.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
